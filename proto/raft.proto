syntax = "proto3";

package raft;

option go_package = "github.com/salmanabdi-dev/distributed-kv/proto/raftpb";

// RaftService carries only internal, node-to-node consensus traffic.
// It is deliberately kept separate from KVService (proto/kv.proto), which
// is the external client-facing surface.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

enum EntryType {
  NOOP = 0;
  PUT = 1;
  DELETE = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  EntryType type = 3;
  string key = 4;
  bytes value = 5;
  string client_request_id = 6;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  // leader's client-facing address, forwarded so followers can serve
  // NOT_LEADER hints without a separate discovery mechanism.
  string leader_client_addr = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Fast conflict backtracking (per the Raft paper's optional optimization):
  // when success is false, the follower reports the term of the conflicting
  // entry at prevLogIndex and the first index of that term, so the leader
  // can jump nextIndex back in one round trip instead of decrementing by one.
  uint64 conflict_term = 3;
  uint64 conflict_index = 4;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5; // serialized full state-machine snapshot
}

message InstallSnapshotResponse {
  uint64 term = 1;
}
