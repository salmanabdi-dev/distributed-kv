syntax = "proto3";

package kv;

option go_package = "github.com/salmanabdi-dev/distributed-kv/proto/kvpb";

// KVService is the client-facing API. Any node can be contacted; if it is
// not the current leader it returns NOT_LEADER (with a leader hint if known)
// instead of silently forwarding, so clients can retry directly against the
// leader.
service KVService {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

enum StatusCode {
  OK = 0;
  NOT_LEADER = 1;
  TIMEOUT = 2;
  NOT_FOUND = 3;
  INTERNAL_ERROR = 4;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  // client_request_id enables idempotent de-duplication on retry.
  string client_request_id = 3;
}

message PutResponse {
  StatusCode status = 1;
  string leader_hint = 2; // client-facing address of current leader, if known
  string error = 3;
}

message GetRequest {
  string key = 1;
  // linearizable, if true, forces a ReadIndex round before answering.
  // If false, the read may be served from local (possibly stale) applied
  // state, which is NOT linearizable but cheaper.
  bool linearizable = 2;
}

message GetResponse {
  StatusCode status = 1;
  bytes value = 2;
  string leader_hint = 3;
  string error = 4;
}

message DeleteRequest {
  string key = 1;
  string client_request_id = 2;
}

message DeleteResponse {
  StatusCode status = 1;
  string leader_hint = 2;
  string error = 3;
}
